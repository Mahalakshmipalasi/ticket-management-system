<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Management System</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Support Desk</h1>
        <p class="subtitle">Create, edit, and organize your team's support requests easily.</p>

        <div class="ticket-stats">   
            <div class="stat-card">
                <h3>Total Tickets</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>Open / Assigned</h3>
                <p id="stat-open">0</p>
            </div>
            <div class="stat-card">
                <h3>In Progress / Hold</h3>
                <p id="stat-progress">0</p>
            </div>
            <div class="stat-card">
                <h3>Resolved / Closed</h3>
                <p id="stat-resolved">0</p>
            </div>
        </div>

        <div class="card">
            <h2 id="form-heading">Create New Ticket</h2>
            <form id="ticket-form">
                <input type="hidden" id="ticket-index">
            
                <div class="form-row-1">
                    <input type="text" id="title" placeholder="Ticket Title *" required>
                    <input type="text" id="requester" placeholder="Requester Name *" required>
                    <input type="text" id="assignee" placeholder="Assignee Name">
                </div>

                <div class="form-row-2">
                    <select id="priority" required>
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                        <option value="Critical">Critical Priority</option>
                    </select>
                    <select id="status" required>
                        <option value="Open" selected>Open</option>
                        <option value="Assigned">Assigned</option>
                        <option value="In Progress">In Progress</option>
                        <option value="On Hold">On Hold</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>

                <div class="form-row-3">
                    <textarea id="description" placeholder="Describe the issue, comments, or resolution notes..." required></textarea>
                </div>
                <div>
                    <button type="submit" class="button" id="save-btn">Save Ticket</button>
                    <button type="button" class="button btn-cancel" id="cancel-btn" style="display:none;" onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Ticket List</h2>
            <div class="toolbar">
                <input type="text" id="search-input" placeholder="Search by title or requester..." oninput="renderApp()">
                <select id="filter-status" onchange="renderApp()">
                    <option value="">All Statuses</option>
                    <option value="Open">Open</option>
                    <option value="Assigned">Assigned</option> 
                    <option value="In Progress">In Progress</option>
                    <option value="On Hold">On Hold</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Requester</th>
                            <th>Assignee</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-table-body">
                    </tbody>
                </table>
            </div>

            <div class="pn-buttons">
                <button type="button" class="button" onclick="prePage()">Previous</button>
                <span id="page-info">Page 1</span>
                <button type="button" class="button" onclick="nextPage()">Next</button>
            </div>

        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
